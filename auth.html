<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Remixa</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0d11;--card:#13161d;--ink:#eceade;--dim:#9b978b;--faint:#6d6a60;--gold:#D4A62A;--line:#20242e}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.6 Geist,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  nav{display:flex;align-items:center;gap:10px;padding:18px 28px}
  nav img{width:26px;height:26px;border-radius:7px}
  nav b{font-size:14.5px;font-weight:500}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
  .gridbg{position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(to right,rgba(236,234,222,.05) 1px,transparent 1px),
                     linear-gradient(to bottom,rgba(236,234,222,.05) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse at center,white 10%,transparent 70%);
            mask-image:radial-gradient(ellipse at center,white 10%,transparent 70%)}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  h1{font-size:22px;font-weight:500;letter-spacing:-.4px;margin-bottom:4px}
  h1 em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:var(--gold)}
  .fs{font-size:13px;color:var(--faint);margin-bottom:20px}
  label{display:block;font-size:12.5px;font-weight:500;color:var(--dim);margin:14px 0 6px}
  input{width:100%;background:#0e1116;border:1px solid #262c38;border-radius:10px;color:var(--ink);font:14px Geist,sans-serif;padding:12px 13px;outline:none;transition:border-color .15s}
  input:focus{border-color:rgba(212,166,42,.55)}
  .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;margin-top:22px;
    background:linear-gradient(180deg,#e6ba3e,#c89a1e);color:#191303;font-weight:600;
    padding:13px;border-radius:999px;font-size:14px;border:none;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 22px rgba(212,166,42,.16);
    transition:transform .14s,box-shadow .14s,filter .14s}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.6;transform:none;cursor:default}
  .err{display:none;color:#e2695f;font-size:12.5px;margin-top:12px;text-align:center}
  .alt{margin-top:18px;text-align:center;font-size:12.5px;color:var(--faint)}
  .alt a{color:var(--gold)}
</style>
</head>
<body>
<nav><a href="campaigns.html" style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt=""><b>Remixa</b></a></nav>
<main>
  <div class="gridbg"></div>
  <div class="card">
    <form id="si">
      <h1>Sign in to <em>Remixa</em></h1>
      <div class="fs">No password — we recognize you by email. New here? This signs you up too.</div>
      <label for="s-name">Name</label>
      <input id="s-name" required maxlength="120" placeholder="Your name" autocomplete="name">
      <label for="s-email">Email</label>
      <input id="s-email" type="email" required maxlength="200" placeholder="you@email.com" autocomplete="email">
      <button class="btn" id="s-go" type="submit">Continue</button>
      <div class="err" id="s-err">Something went wrong — try again in a minute.</div>
      <div class="alt">Creator questions? <a id="s-disc" href="#">Ask in the Discord</a></div>
    </form>
  </div>
</main>
<script>
const DISCORD_URL = "https://discord.gg/FjYE5hHMdr";
document.getElementById('s-disc').href = DISCORD_URL;
document.getElementById('s-disc').target = "_blank";
// already signed in -> straight to the portal
try{ if(localStorage.getItem('remixa_user')) location.replace('portal.html'); }catch(e){}
document.getElementById('si').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const b=document.getElementById('s-go'), err=document.getElementById('s-err');
  const name=document.getElementById('s-name').value.trim();
  const email=document.getElementById('s-email').value.trim();
  b.disabled=true; b.textContent='Signing in…'; err.style.display='none';
  try{
    const r=await fetch("https://remixa-relay.nickr6767.workers.dev/waitlist",{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'creator',name,email,notes:'portal sign-in'})});
    const j=await r.json();
    if(!r.ok||!j.ok) throw new Error('failed');
    localStorage.setItem('remixa_user', JSON.stringify({name,email,at:Date.now()}));
    location.href='portal.html';
  }catch(ex){
    err.style.display='block';
    b.disabled=false; b.textContent='Continue';
  }
});
</script>
</body>
</html>
